<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Статистика БУХЛОЧАТ</title>
    <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
    <div class="container">
        <div class="topbar hidden" id="topbar">
            <a href="../index.html" class="logo">БУХЛОЧАТ</a>
            <div class="topbar-actions">
                <a href="admin.html" class="btn secondary">В админку</a>
                <a href="../index.html" class="btn secondary">На главную</a>
                <button class="btn secondary" onclick="logoutAdmin()">Выйти</button>
            </div>
        </div>

        <div id="auth-block">
            <div class="auth-box">
                <h2>Статистика</h2>
                <p>Войдите через Supabase Auth</p>
                <input type="email" id="admin-email" placeholder="Email администратора" autocomplete="username" />
                <input type="password" id="admin-password" placeholder="Пароль..." />
                <button class="btn" style="width:100%;" onclick="checkAdminLogin()">Войти</button>
                <div id="admin-error" class="error-msg"></div>
                <div style="margin-top: 15px;">
                    <a href="admin.html" class="btn secondary" style="display:block; text-align:center;">← В админку</a>
                </div>
            </div>
        </div>

        <div id="dashboard" class="dashboard hidden">
            <section class="panel">
                <h3>Посещаемость</h3>
                <div class="stats-cards" id="visit-cards"></div>
                <div class="stats-range">
                    <label for="stats-days">Период графика:</label>
                    <select id="stats-days" onchange="loadStats()">
                        <option value="14">14 дней</option>
                        <option value="30" selected>30 дней</option>
                        <option value="90">90 дней</option>
                    </select>
                    <button class="btn secondary" onclick="loadStats()">Обновить</button>
                </div>
                <div class="stats-chart" id="visit-chart"></div>
            </section>

            <section class="panel">
                <h3>Хранилище (BHCH_DATA)</h3>
                <div class="stats-cards" id="storage-cards"></div>
                <div id="storage-folders"></div>
            </section>
        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/stats.js"></script>
</body>
</html>
